# Apache site for usepartwise.com (on the droplet).
#
#   /            the website (/login, /register, /dashboard)
#   /editor/     the score editor
#   /api/        the API (server.js in Docker, port 5000)
#
# Setup, once:
#   sudo cp deploy/apache/usepartwise.com.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http
#   sudo a2ensite usepartwise.com && sudo systemctl reload apache2
#   sudo certbot --apache -d usepartwise.com -d www.usepartwise.com   (adds HTTPS)
#
# Deploy: copy the contents of "Most Recent Partwise Files/dist/" (built with
# `npm run build` after the editor's `npm run build:site`) into
# /var/www/usepartwise/.

<VirtualHost *:80>
    ServerName usepartwise.com
    ServerAlias www.usepartwise.com
    DocumentRoot /var/www/usepartwise

    # The API
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    <Directory /var/www/usepartwise>
        Require all granted
        # Pages like /dashboard aren't files: the site's index.html shows them
        FallbackResource /index.html
    </Directory>

    <Directory /var/www/usepartwise/editor>
        FallbackResource /editor/index.html
    </Directory>

    # pdf.js's worker
    AddType text/javascript .mjs

    ErrorLog ${APACHE_LOG_DIR}/usepartwise-error.log
    CustomLog ${APACHE_LOG_DIR}/usepartwise-access.log combined
</VirtualHost>
