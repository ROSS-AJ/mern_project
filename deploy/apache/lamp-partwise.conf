# For the old host, lamp.rosslampdemo.com/partwise/, until the move.
#
# The site now has real page addresses (/partwise/login, /partwise/dashboard,
# ...), so Apache must answer them with the site's index.html. Add these lines
# inside the existing lamp.rosslampdemo.com <VirtualHost> (in
# /etc/apache2/sites-available/), then `sudo systemctl reload apache2`.
#
# Build for this host with `npm run build:site:lamp` (web/) and
# `npm run build:lamp` (Most Recent Partwise Files/), then copy dist/ into
# /var/www/html/partwise/ as before.

<Directory /var/www/html/partwise>
    FallbackResource /partwise/index.html
</Directory>

<Directory /var/www/html/partwise/editor>
    FallbackResource /partwise/editor/index.html
</Directory>

AddType text/javascript .mjs

# After moving to usepartwise.com, replace the lines above with this, so old
# links keep working:
#   RedirectMatch 301 ^/partwise/(.*)$ https://usepartwise.com/$1
